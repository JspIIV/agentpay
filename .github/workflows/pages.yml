name: Deploy app to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # vite-plugin-node-polyfills declares a narrower vite peer range than the
      # one this project uses; the combination works, npm just refuses to
      # resolve it without being told to.
      - run: npm install --legacy-peer-deps --no-audit --no-fund

      - run: npx tsc --noEmit

      - run: npx vite build
        env:
          GITHUB_PAGES: '1'
          # Public values, not secrets: the deployed contract and the block it
          # landed in. The Activity screen scans PaymentMade logs from that block.
          VITE_AGENTPAY_ADDRESS: '0xCcf147e5D564033114f1cA6e86E0A47185eab26C'
          VITE_AGENTPAY_DEPLOY_BLOCK: '24786205'

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
